<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3f3a"/><stop offset="1" stop-color="#041417"/>
    </linearGradient>
    <radialGradient id="glow" cx=".66" cy=".27" r=".42">
      <stop offset="0" stop-color="#7dffb0" stop-opacity=".20"/><stop offset="1" stop-color="#7dffb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9ff7a"/><stop offset="1" stop-color="#9be84a"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfeee6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="lg" x="-30%" y="-80%" width="160%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#b6ff5e" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- the E: a stem and three arms that grow toward the top -->
  <g filter="url(#sh)">
    <rect x="296" y="262" width="84" height="500" rx="42" fill="url(#white)"/>
    <rect x="296" y="682" width="262" height="80" rx="40" fill="url(#white)"/>
    <rect x="296" y="472" width="342" height="80" rx="40" fill="url(#white)"/>
    <rect x="296" y="262" width="430" height="80" rx="40" fill="url(#lime)" filter="url(#lg)"/>
  </g>
</svg>
