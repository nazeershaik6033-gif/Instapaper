<script>
/* When embedded in another app (Naz Trades) inside an iframe, iOS Safari
   mis-applies "maximum-scale" / "viewport-fit=cover" and renders the app
   zoomed-in. Normalise the viewport so it lays out 1:1 with the frame. */
try{
  if(window.self!==window.top){
    var _vp=document.querySelector('meta[name="viewport"]');
    if(_vp)_vp.setAttribute('content','width=device-width, initial-scale=1.0');
  }
}catch(e){}
</script>
<script>
/* iPhone home-screen apps with a see-through status bar: iOS can size the page as if the screen were
   shorter by the top inset, leaving an empty strip at the bottom. Measure the real height and stretch
   the app (and every full-screen layer) to the true bottom edge. --vgap is 0 where the bug is absent. */
(function(){
  function fit(){
    try{
      var r=document.documentElement,g=0;
      var standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
      if(standalone&&/iPhone|iPod/.test(navigator.userAgent)&&window.self===window.top){
        var land=window.innerWidth>window.innerHeight;
        var full=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
        g=Math.round(full-window.innerHeight);if(g<0||g>110)g=0;
      }
      r.style.setProperty('--vgap',g+'px');r.style.setProperty('--app-h',window.innerHeight+'px');
      if(g>0)r.classList.add('vgap');else r.classList.remove('vgap');
      window.__screenFit={inner:window.innerHeight,screen:screen.height,gap:g,standalone:standalone};
    }catch(e){}
  }
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')setTimeout(fit,100)});
})();
</script>
<script>
/* paint the saved theme before anything renders to avoid a flash */
try{
  var _s=JSON.parse(localStorage.getItem('instapaper_v1')||'{}').settings;
  var _t=_s&&_s.theme;
  var _bg={light:'#ffffff',sepia:'#f9f2e4',dark:'#1c1c1e',black:'#000000'}[_t]||'#ffffff';
  var _dk=(_t==='dark'||_t==='black');
  document.documentElement.style.background=_bg;
  document.addEventListener('DOMContentLoaded',function(){
    document.body.style.background=_bg;
    var spl=document.getElementById('spl');
    if(spl){spl.style.background=_bg;spl.style.color=_dk?'#8a8a90':'#1c1c1e'}
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',_bg);
  });
}catch(e){}
</script>

<div id="root"></div>
<script>
/* Watchdog: if the app hasn't mounted shortly after load, the cached app.js
   or React runtime is probably broken — clear caches + service worker once and
   reload to self-heal. If the app did mount, just fade the splash out. */
setTimeout(function(){
  var root=document.getElementById('root');
  var spl=document.getElementById('spl');
  var mounted=root&&root.childElementCount>0;
  if(mounted){try{sessionStorage.removeItem('insta_recover')}catch(e){}if(spl)spl.classList.add('hide');return;}
  var tried;try{tried=sessionStorage.getItem('insta_recover')}catch(e){}
  if(!tried){
    try{sessionStorage.setItem('insta_recover','1')}catch(e){}
    var reload=function(){location.reload()};
    var jobs=[];
    try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}))}catch(e){}
    try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}))}catch(e){}
    Promise.all(jobs).then(reload,reload);
  }else if(spl){
    spl.innerHTML='<div style="text-align:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;color:#76767c;padding:30px;line-height:1.55">Couldn’t load Instapaper.<br/>Check your connection, then fully close and reopen the app.</div>';
  }
},7000);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
    var refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!refreshing){refreshing=true;window.location.reload()}
    });
  });
}
/* Fallback: if React never mounts (CDN blocked, JS error before createRoot, etc.)
   hide the splash after 8 s so the user isn't permanently stuck on the loading screen. */
setTimeout(function(){
  var s=document.getElementById('spl');
  if(s&&!s.classList.contains('hide'))s.classList.add('hide');
},8000);
</script>
