name: Refresh feeds (every 15 min)
# GitHub's cron is best-effort: on a quiet repo the "Refresh feeds (schedule)" job fires only
# every 4-6 hours, so My Routine's server copy can be hours behind a new upload.
# This job doesn't depend on the scheduler. One run stays alive for ~5.5 hours and refreshes
# feeds.json every 15 minutes, then starts the next run of itself (a workflow_dispatch made with
# the job's own token is allowed to start a run). Free on a public repo.
# Each pass first applies any "sources" issue the app opened for you (one tap in the app), then
# refreshes, gets Instagram / X / Threads posts from free bridges (scripts/bridge-social.mjs, with
# RSS.app links only as a backup), and builds your social RSS feed (scripts/build-social-feed.mjs)
# on the `social-feed` branch.
# Free bridges: RSS-Bridge and RSSHub run as containers inside this job (nothing to host). Optional
# repository secrets make them more reliable: IG_SESSION_ID + IG_DS_USER_ID (Instagram cookies) and
# TWITTER_AUTH_TOKEN (X cookie, for RSSHub). Optional MINIFLUX_URL + MINIFLUX_TOKEN: every source is
# also added to your Miniflux (see miniflux/README.md).
#   Start it:  Actions -> "Refresh feeds (every 15 min)" -> Run workflow (it also starts when this file changes on main)
#   Stop it:   cancel the running job, or Actions -> this workflow -> ... -> Disable workflow
# The app's sources sync (Settings -> Social RSS feed, with a GitHub token) starts a run with the
# `sources` input: that run takes over, writes routine-sources.json to main and rebuilds the feeds
# straight away, so new accounts show up in a minute or two instead of waiting for the next pass.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources JSON from the app: {"urls":[...],"accounts":[...]} (leave empty to just run)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/refresh-feeds-loop.yml]
permissions:
  contents: write
  actions: write
  issues: write
# No `concurrency` group on purpose: a queued run would wait hours behind an older loop. Instead the
# newest run cancels every older run of this workflow as its first step, so there is only ever one loop
# and a changed workflow file takes over straight away.
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EVERY_MIN: 15
      RUN_FOR_MIN: 330
    steps:
      - name: Take over from any older loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-feeds-loop.yml --limit 50 \
              --json databaseId,status \
              --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\" or .status == \"waiting\") | .databaseId" \
            | while read -r id; do echo "cancelling older run $id"; gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the free feed bridges (RSS-Bridge, RSSHub)
        # never blocks the feed: if an image can't be pulled, that bridge is skipped
        continue-on-error: true
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          IG_DS_USER_ID: ${{ secrets.IG_DS_USER_ID }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --name rssbridge -p 3000:80 \
            -e RSSBRIDGE_system_enabled_bridges='*' \
            -e RSSBRIDGE_InstagramBridge_session_id="$IG_SESSION_ID" \
            -e RSSBRIDGE_InstagramBridge_ds_user_id="$IG_DS_USER_ID" \
            rssbridge/rss-bridge:latest || echo "::warning::RSS-Bridge did not start"
          docker run -d --name rsshub -p 1200:1200 -e CACHE_EXPIRE=600 \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            diygod/rsshub:latest || echo "::warning::RSSHub did not start"
          for i in $(seq 1 45); do
            curl -s -o /dev/null http://localhost:3000/ && curl -s -o /dev/null http://localhost:1200/ && break
            sleep 2
          done
          curl -s -o /dev/null -w 'RSS-Bridge: %{http_code}\n' http://localhost:3000/ || true
          curl -s -o /dev/null -w 'RSSHub: %{http_code}\n' http://localhost:1200/ || true
      - name: Apply sources sent by the app
        if: ${{ inputs.sources != '' }}
        env:
          # passed through the environment (never pasted into the script), then validated by apply-sources.mjs
          SOURCES: ${{ inputs.sources }}
        run: |
          printf '%s' "$SOURCES" > "$RUNNER_TEMP/sources.txt"
          if why=$(node scripts/apply-sources.mjs "$RUNNER_TEMP/sources.txt" routine-sources.json 2>&1); then
            echo "$why"
            git config user.name "feed-refresh[bot]"; git config user.email "feed-refresh@users.noreply.github.com"
            git add routine-sources.json
            if git diff --cached --quiet; then echo "routine-sources.json already up to date"
            else
              git commit -q -m "Update routine sources from the app"
              for i in 1 2 3; do
                git push -q origin HEAD:main && break
                git fetch -q origin main && git rebase -q FETCH_HEAD || { git rebase --abort || true; git reset -q --hard FETCH_HEAD; node scripts/apply-sources.mjs "$RUNNER_TEMP/sources.txt" routine-sources.json && git add routine-sources.json && git commit -q -m "Update routine sources from the app"; }
                sleep $((i * 3))
              done
            fi
          else
            echo "::error::Sources from the app were not applied: $why"
            exit 1
          fi
      - name: Refresh every ${{ env.EVERY_MIN }} minutes
        timeout-minutes: 340
        env:
          GH_TOKEN: ${{ github.token }}
          RSSBRIDGE_URL: http://localhost:3000
          RSSHUB_URL: http://localhost:1200
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          MINIFLUX_URL: ${{ secrets.MINIFLUX_URL }}
          MINIFLUX_TOKEN: ${{ secrets.MINIFLUX_TOKEN }}
        run: |
          # publish <folder> <branch>: the folder's files become a one-commit branch
          publish() {
            ( cd "$1" && rm -rf .git && git init -q -b "$2" \
              && git config user.name "feed-refresh[bot]" \
              && git config user.email "feed-refresh@users.noreply.github.com" \
              && git add -A && git commit -q -m "$2 $(date -u +%FT%TZ)" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$2" )
          }
          # Apply "sources" issues opened by the repo owner (the app's "Update sources on GitHub" button):
          # write routine-sources.json, commit it to main, answer and close the issue.
          apply_issues() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "$GITHUB_REPOSITORY_OWNER" --limit 20 \
                --json number,title,authorAssociation \
                --jq '[.[] | select(.authorAssociation == "OWNER") | select(.title | ascii_downcase | startswith("sources"))] | sort_by(.number) | .[].number' |
            while read -r n; do
              gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/issue.txt"
              if why=$(node scripts/apply-sources.mjs "$RUNNER_TEMP/issue.txt" routine-sources.json 2>&1); then
                git config user.name "feed-refresh[bot]"; git config user.email "feed-refresh@users.noreply.github.com"
                git add routine-sources.json
                if git diff --cached --quiet; then msg="Already up to date: $why"
                elif git commit -q -m "Update routine sources from the app (issue #$n)" && git push -q origin HEAD:main; then msg="Applied: $why. The feeds refresh within 15 minutes."
                else msg="Could not push to main (is it protected?). Nothing was changed."; git reset -q --hard FETCH_HEAD; fi
              else msg="Not applied: $why"; fi
              echo "issue #$n: $msg"
              gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$msg" || true
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
            done
          }
          end=$(( $(date +%s) + RUN_FOR_MIN * 60 ))
          while :; do
            started=$(date +%s)
            # pick up source-list or script changes on main without restarting the loop
            # always start a pass from the newest main (new sources, scripts, workflow tweaks)
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD || true
            apply_issues || true
            pub="$RUNNER_TEMP/pub"; rm -rf "$pub"; mkdir -p "$pub/feeds" "$pub/social"
            if [ -f routine-sources.json ] && node scripts/refresh-feeds.mjs routine-sources.json "$pub/feeds/feeds.json"; then
              # Instagram / X / Threads from free bridges (RSS.app link last), into the same feeds.json
              node scripts/bridge-social.mjs routine-sources.json "$pub/feeds/feeds.json" || echo "bridging failed $(date -u +%T)"
              publish "$pub/feeds" feeds-data && echo "feeds published $(date -u +%T)" || echo "feeds publish failed $(date -u +%T)"
              if node scripts/build-social-feed.mjs routine-sources.json "$pub/feeds/feeds.json" "$pub/social"; then
                publish "$pub/social" social-feed && echo "social feed published" || echo "social feed publish failed"
                if [ -n "$MINIFLUX_URL" ] && [ -n "$MINIFLUX_TOKEN" ]; then
                  node scripts/miniflux-sync.mjs routine-sources.json "$pub/social/index.json" || echo "miniflux sync failed"
                fi
              fi
            else
              echo "refresh failed $(date -u +%T)"
            fi
            next=$(( started + EVERY_MIN * 60 ))
            [ "$next" -ge "$end" ] && break
            wait_s=$(( next - $(date +%s) ))
            if [ "$wait_s" -gt 0 ]; then sleep "$wait_s"; fi
          done
      - name: Start the next run
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-feeds-loop.yml --ref main --repo "$GITHUB_REPOSITORY"
