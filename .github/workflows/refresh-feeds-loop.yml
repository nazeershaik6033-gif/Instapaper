name: Refresh feeds (every 15 min)
# GitHub's cron is best-effort: on a quiet repo the "Refresh feeds (schedule)" job fires only
# every 4-6 hours, so My Routine's server copy can be hours behind a new upload.
# This job doesn't depend on the scheduler. One run stays alive for ~5.5 hours and refreshes
# feeds.json every 15 minutes, then starts the next run of itself (a workflow_dispatch made with
# the job's own token is allowed to start a run). Free on a public repo.
# Each pass also builds your social RSS feed (scripts/build-social-feed.mjs) on the `social-feed` branch.
#   Start it:  Actions -> "Refresh feeds (every 15 min)" -> Run workflow (it also starts when this file changes on main)
#   Stop it:   cancel the running job, or Actions -> this workflow -> ... -> Disable workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-feeds-loop.yml]
permissions:
  contents: write
  actions: write
# No `concurrency` group on purpose: a queued run would wait hours behind an older loop. Instead the
# newest run cancels every older run of this workflow as its first step, so there is only ever one loop
# and a changed workflow file takes over straight away.
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EVERY_MIN: 15
      RUN_FOR_MIN: 330
    steps:
      - name: Take over from any older loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-feeds-loop.yml --limit 50 \
              --json databaseId,status \
              --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\" or .status == \"waiting\") | .databaseId" \
            | while read -r id; do echo "cancelling older run $id"; gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh every ${{ env.EVERY_MIN }} minutes
        timeout-minutes: 340
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # publish <folder> <branch>: the folder's files become a one-commit branch
          publish() {
            ( cd "$1" && rm -rf .git && git init -q -b "$2" \
              && git config user.name "feed-refresh[bot]" \
              && git config user.email "feed-refresh@users.noreply.github.com" \
              && git add -A && git commit -q -m "$2 $(date -u +%FT%TZ)" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$2" )
          }
          end=$(( $(date +%s) + RUN_FOR_MIN * 60 ))
          while :; do
            started=$(date +%s)
            # pick up source-list or script changes on main without restarting the loop
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- routine-sources.json scripts/ || true
            pub="$RUNNER_TEMP/pub"; rm -rf "$pub"; mkdir -p "$pub/feeds" "$pub/social"
            if [ -f routine-sources.json ] && node scripts/refresh-feeds.mjs routine-sources.json "$pub/feeds/feeds.json"; then
              publish "$pub/feeds" feeds-data && echo "feeds published $(date -u +%T)" || echo "feeds publish failed $(date -u +%T)"
              if node scripts/build-social-feed.mjs routine-sources.json "$pub/feeds/feeds.json" "$pub/social"; then
                publish "$pub/social" social-feed && echo "social feed published" || echo "social feed publish failed"
              fi
            else
              echo "refresh failed $(date -u +%T)"
            fi
            next=$(( started + EVERY_MIN * 60 ))
            [ "$next" -ge "$end" ] && break
            wait_s=$(( next - $(date +%s) ))
            if [ "$wait_s" -gt 0 ]; then sleep "$wait_s"; fi
          done
      - name: Start the next run
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-feeds-loop.yml --ref main --repo "$GITHUB_REPOSITORY"
