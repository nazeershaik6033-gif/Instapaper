name: Transcribe self-test (temporary)
on:
  push:
    branches: [claude/laughing-mayer-atfj9f]
    paths: [scripts/transcribe.py, scripts/transcribe-requirements.txt, .github/workflows/transcribe-selftest.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r scripts/transcribe-requirements.txt
      - name: Transcribe a 19-second video
        run: |
          python scripts/transcribe.py --url "https://www.youtube.com/watch?v=jNQXAC9IVRw" --model tiny --id selftest01 --out out.json || true
          python -c "import json;d=json.load(open('out.json'));print({k:v for k,v in d.items() if k!='segments'});assert d['status']=='done'"
